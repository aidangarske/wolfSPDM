name: Feature request
description: Propose new functionality for wolfSPDM
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or what need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should wolfSPDM do?
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Specification references
      description: Clauses from DSP0274, DSP0277, DSP0275, the TCG SPDM binding, or other specs that apply.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know it is done (unit tests, spdm-emu runs, hardware runs).
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Area
      placeholder: "e.g. requester, responder, TCG binding, PQC, wolfTPM integration, CI"
    validations:
      required: true
